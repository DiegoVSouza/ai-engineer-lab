app = "supportops-lab-redis"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "../../ops/fly/redis/Dockerfile"

[[mounts]]
  source = "redis_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 14

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"

[checks.redis-ready]
  type = "tcp"
  port = 6379
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"

[[services]]
  protocol = "tcp"
  internal_port = 6379
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 6379
