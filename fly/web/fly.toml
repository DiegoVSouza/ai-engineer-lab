app = "supportops-lab-web"
primary_region = "iad"

[build]
  dockerfile = "../../projects/p06/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  method = "GET"
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"

[env]
  P05_API_URL = "https://supportops-lab-p05.fly.dev"
  OIDC_ISSUER = "https://supportops-lab-idp.fly.dev/realms/supportops"
  OIDC_ORIGIN = "https://supportops-lab-idp.fly.dev"
  OIDC_CLIENT_ID = "supportops-web"
