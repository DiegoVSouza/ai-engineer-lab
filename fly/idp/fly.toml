app = "supportops-lab-idp"
primary_region = "iad"

[build]
  dockerfile = "../../ops/fly/idp/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[checks.keycloak-realm-ready]
  type = "http"
  port = 9000
  method = "GET"
  path = "/health/ready"
  interval = "30s"
  timeout = "5s"
  grace_period = "300s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "2gb"

[env]
  KC_BOOTSTRAP_ADMIN_USERNAME = "lab-admin"
  KC_DB = "postgres"
  KC_DB_URL = "jdbc:postgresql://supportops-lab-db.internal:5432/keycloak"
  KC_DB_USERNAME = "keycloak"
  KC_HEALTH_ENABLED = "true"
  KC_HTTP_ENABLED = "true"
  KC_HTTP_MANAGEMENT_PORT = "9000"
  KC_HOSTNAME = "https://supportops-lab-idp.fly.dev"
  KC_HOSTNAME_STRICT = "true"
  KC_PROXY_HEADERS = "xforwarded"
