app = "supportops-lab-mcp"
primary_region = "iad"

[build]
  dockerfile = "../../projects/p05/Dockerfile"

[processes]
  app = "python -m uvicorn supportops_platform.mcp.runtime:create_mcp_app --factory --host 0.0.0.0 --port 8000 --log-config /app/logcfg/uvicorn-log.json"

[[services]]
  processes = ["app"]
  protocol = "tcp"
  internal_port = 8000
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.checks]]
    type = "tcp"
    port = 8000
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
  processes = ["app"]

[env]
  PYTHONPATH = "/app/logcfg"
  LLM_MODE = "fake"
  OTEL_EXPORTER_OTLP_ENDPOINT = "http://supportops-lab-jaeger.internal:4317"
  OTEL_SERVICE_NAME = "p05-mcp"
  MCP_URL = "https://supportops-lab-mcp.fly.dev/mcp"
  MCP_ISSUER = "https://supportops-lab-mcp.fly.dev/issuer"
