app = "supportops-lab-p05"
primary_region = "iad"

[build]
  dockerfile = "../../projects/p05/Dockerfile"

[processes]
  app = "python -m uvicorn supportops_platform.api.app:app --host 0.0.0.0 --port 8000"
  worker = "python -m supportops_platform.service_runtime"

[http_service]
  internal_port = 8000
  force_https = true
  processes = ["app"]
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  method = "GET"
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "45s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
  processes = ["worker"]

[[metrics]]
  port = 8000
  path = "/metrics"
  processes = ["app"]

[[mounts]]
  source = "p05_graph"
  destination = "/app/artifacts"
  processes = ["worker"]
  initial_size = "1gb"
  snapshot_retention = 14

[env]
  LLM_MODE = "fake"
  P05_RUNTIME = "services"
  P05_QUEUE_NAME = "supportops-p05-tasks"
  OTEL_EXPORTER_OTLP_ENDPOINT = "http://supportops-lab-jaeger.internal:4317"
  OTEL_SERVICE_NAME = "p05-runtime"
  API_AUTH_MODE = "oidc"
  P05_METRICS_PORT = "8001"
  MCP_URL = "https://supportops-lab-mcp.fly.dev/mcp"
  MCP_ISSUER = "https://supportops-lab-mcp.fly.dev/issuer"
  SUPPORTOPS_LANGGRAPH_DB = "/app/artifacts/langgraph-checkpoints.sqlite"

[[metrics]]
  port = 8001
  path = "/metrics"
  processes = ["worker"]
