app = "supportops-lab-sns"
primary_region = "iad"

[build]
  dockerfile = "../../ops/fly/sns/Dockerfile"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[env]
  SERVICES = "sns"
  GATEWAY_LISTEN = "[::]:4566"
  AWS_DEFAULT_REGION = "us-east-1"

[checks.localstack-ready]
  type = "tcp"
  port = 4566
  interval = "15s"
  timeout = "5s"
  grace_period = "60s"

[[services]]
  protocol = "tcp"
  internal_port = 4566
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 4566
