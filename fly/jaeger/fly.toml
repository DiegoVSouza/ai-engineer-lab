app = "supportops-lab-jaeger"
primary_region = "iad"

[build]
  dockerfile = "../../ops/fly/jaeger/Dockerfile"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 4317
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 4317
